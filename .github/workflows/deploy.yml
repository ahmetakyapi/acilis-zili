name: Deploy

# `main`'e her push — merge dahil — sunucuda YENİ BİR SÜRÜM çıkarır.
#
# İKİ İŞ VAR ve ikinci, birincisi geçmeden BAŞLAMAZ:
#
# 1. verify — GitHub'ın runner'ında typecheck + lint + build. Kırık bir
#    commit sunucuya hiç dokunmadan burada elenir; VPS'e SSH atıp derlemenin
#    ortasında patlamasını beklemek hem yavaş hem de o sırada eski sürüm
#    zaten ayaktayken gereksiz bir risk.
#
# 2. deploy — `deploy/update.sh`'ı sunucuda ÇALIŞTIRIR, kod BURADAN
#    KOPYALANMAZ. Betik kendi `git clone`'unu yapıyor (releases/<sürüm>),
#    kendi sağlık kontrolünü yapıyor, geçmezse önceki sürüme kendi geri
#    dönüyor — bu iş akışı `deploy/remote.sh` ile elle yapılanın AYNISI,
#    tek fark tetikleyicinin insan değil push olması.
#
# Otomatik deploy'un GEREKÇESİ `docs/deploy-vps.md`'de.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Token SALT OKUNUR ve checkout'ta diske YAZILMIYOR (15 Ekim taraması).
# `permissions` yokken token depo varsayılanını alıyor ve checkout@v4
# varsayılanı onu `.git/config`e yazıyordu; hemen ardından `npm ci`
# yüzlerce bağımlılığın postinstall'ını o token erişilebilirken koşuyor —
# update.sh'ın VPS için belgeleyip kapattığı tedarik zinciri senaryosunun
# CI tarafı. Hiçbir adım token'la push yapmıyor (deploy SSH anahtarıyla).
permissions:
  contents: read

# SÜRÜMLER SABİT (15 Ekim): checkout/setup-node v5 Node 24 çalışma zamanında
# koşuyor (v4'ün Node 20'si kullanımdan kalktı, Actions uyarıyordu). Runner
# `ubuntu-24.04`e sabit: `ubuntu-latest` 19 Ekim'den itibaren Ubuntu 26'ya
# geçiyor ve deploy hattının sessizce değişmesi istenmiyor — yükseltme
# bilinçli bir commit olsun. Diğer iş akışları da aynı sürümlerde.
#
# Eylemler COMMIT'E sabit, etikete değil (20 Ekim). `@v5` yeniden
# yönlendirilebilen bir etiket: her v5.x.y'yi commit'siz alıyordu, yani
# yukarıdaki "bilinçli commit" sözü eylemler için tutmuyordu. Ve deploy
# işinde checkout'un yazdığı `deploy/*.sh` bir sonraki adımda VPS anahtarıyla
# (ubuntu@ + parolasız sudo = sunucuda root) koşuyor; taşınmış ya da ele
# geçirilmiş bir etiket o betikleri değiştirebilirdi. Yanındaki `# v5.x.y`
# yalnız okunsun diye; yükseltme = yeni etiketin commit'i
# (`git ls-remote https://github.com/actions/checkout 'refs/tags/v5*'`).
# Sabitlendiği gün `v5` etiketi de bu commit'lerdeydi — davranış aynı.

# ZAMAN AŞIMI (20 Ekim). Sunucuya dokunan her iş `deploy-vps` grubunda sıra
# bekliyor; süresiz bir iş GitHub varsayılanı olan 360 dakika boyunca
# arkasındaki her push'u, env eşitlemesini ve düzeltmeyi bekletirdi. SSH'te
# yalnız ConnectTimeout vardı: oturum kurulduktan sonra VPS donarsa ya da yol
# koparsa ssh çekirdeğin ~2 saatlik TCP keepalive'ını bekliyordu.
# `ServerAliveInterval=30` + `ServerAliveCountMax=4` ölü bağlantıyı iki
# dakikada düşürür. Kesmek güvenli: update.sh SIGPIPE/SIGHUP'ta canlıya
# çıkmamış sürümü temizliyor (cleanup). Süreler son koşumların (6-14 dk)
# birkaç katı; VPS derlemesi ARM'de yavaşlayabilir diye deploy'da geniş.

# `queue: max` (16 Ekim): onsuz grupta yalnız BİR koşum bekliyor ve yeni
# gelen — ör. elle tetiklenen "Sync App Env" — bekleyen yayını sessizce
# iptal ediyordu; son commit bir sonraki push'a kadar yayına inmiyordu, iz
# yalnız Actions'taki "canceled". Sunucuya dokunan dört iş akışı da aynı
# grupta ve aynı ayarla.
concurrency:
  group: deploy-vps
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Sıra bilinçli: typecheck `.next/types` altındaki üretilmiş tipleri
      # (PageProps, RouteContext) okuyor ve onlar yalnızca build sırasında
      # üretiliyor — CLAUDE.md'nin de belirttiği gibi build'den önce
      # typecheck çalıştırmak "Cannot find name 'PageProps'" verir.
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint

  deploy:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # Sunucunun SSH host anahtarı biliniyorsa SABİTLENİR. Runner her
      # koşumda boş known_hosts ile başladığı için `accept-new` fiilen "her
      # anahtarı kabul et" demek; VPS'e giden yolu kesen biri araya kendi
      # sunucusunu koyup stdin'den akan analiz anahtarını okuyabilirdi.
      # `VPS_HOST_KEY` repo değişkeni (bir kez `ssh-keyscan <host>` çıktısı)
      # tanımlıysa bağlantı yalnızca o anahtarı kabul eder; tanımlı değilse
      # eski davranış sürer ki deploy kilitlenmesin — değişkeni tanımlamak
      # bu uyarının kapanışı.
      - name: Host anahtarını sabitle
        env:
          VPS_HOST_KEY: ${{ vars.VPS_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          if [[ -n "$VPS_HOST_KEY" ]]; then
            printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
            echo "strict=yes" >> "$GITHUB_ENV"
          else
            echo "strict=accept-new" >> "$GITHUB_ENV"
          fi
      # Servis burada yeniden başlatılmıyor, update.sh birazdan başlatıyor
      # (20 Ekim). Başlatılıyordu ve her push, dakikalar süren derlemeden ÖNCE
      # eski sürümü bir kez daha düşürüyordu — fazladan bir 502 penceresi ve
      # yarıda kalan uzun istek (ücretli analiz, cron taraması). Derleme
      # düşerse yeni anahtar bir sonraki başlatmaya kalır; acilse elle
      # "Sync Claude Analysis Key" koşulur, o servisi başlatıyor.
      - name: Analiz anahtarını sunucuya aktar
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ vars.VPS_HOST }}
          RESTART: "0"
          CLAUDE_ANALYSIS_API_KEY: ${{ secrets.CLAUDE_ANALYSIS_API_KEY }}
        run: |
          if [[ -n "$CLAUDE_ANALYSIS_API_KEY" ]]; then
            bash deploy/sync-analysis-key.sh
          else
            echo "Analiz secret tanımlı değil; mevcut sunucu ortamı korunuyor."
          fi
      # E-posta ve Web Push anahtarları (15 Ekim): yalnız GitHub'da TANIMLI
      # olanlar sunucuya yazılır, tanımsız olan sunucudaki değerini korur.
      # Servis burada yeniden başlatılmıyor; hemen ardından update.sh başlatıyor.
      - name: Uygulama ortamını sunucuya aktar
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ vars.VPS_HOST }}
          RESTART: "0"
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          SITE_INDEXABLE: ${{ vars.SITE_INDEXABLE }}
          # Telegram kanalı (24 Ekim): belirteç secret; kanal kimlikleri ve
          # kanal adresi repo DEĞİŞKENİ (gizli değil, sitede basılıyor).
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ vars.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_CHANNEL_ID_EN: ${{ vars.TELEGRAM_CHANNEL_ID_EN }}
          NEXT_PUBLIC_TELEGRAM_URL: ${{ vars.NEXT_PUBLIC_TELEGRAM_URL }}
        run: bash deploy/sync-app-env.sh
      # Sunucu verify'ın geçtiği commit'i derler, dal ucunu değil
      # (`GITHUB_SHA`, gerekçe update.sh başında).
      - name: SSH ile sunucuda update.sh çalıştır
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ vars.VPS_HOST }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null /tmp/deploy_key
          printf '%s\n' "$SSH_KEY" > /tmp/deploy_key
          ssh -i /tmp/deploy_key -o "StrictHostKeyChecking=${strict:-accept-new}" -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=4 \
            "ubuntu@${HOST}" \
            "sudo -u acilis -H bash /srv/acilis-zili/current/deploy/update.sh ${GITHUB_SHA}"
