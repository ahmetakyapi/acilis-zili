name: Deploy

# `main`'e her push — merge dahil — sunucuda YENİ BİR SÜRÜM çıkarır.
#
# İKİ İŞ VAR ve ikinci, birincisi geçmeden BAŞLAMAZ:
#
# 1. verify — GitHub'ın runner'ında typecheck + lint + build. Kırık bir
#    commit sunucuya hiç dokunmadan burada elenir; VPS'e SSH atıp derlemenin
#    ortasında patlamasını beklemek hem yavaş hem de o sırada eski sürüm
#    zaten ayaktayken gereksiz bir risk.
#
# 2. deploy — `deploy/update.sh`'ı sunucuda ÇALIŞTIRIR, kod BURADAN
#    KOPYALANMAZ. Betik kendi `git clone`'unu yapıyor (releases/<sürüm>),
#    kendi sağlık kontrolünü yapıyor, geçmezse önceki sürüme kendi geri
#    dönüyor — bu iş akışı `deploy/remote.sh` ile elle yapılanın AYNISI,
#    tek fark tetikleyicinin insan değil push olması.
#
# Otomatik deploy'un GEREKÇESİ `docs/deploy-vps.md`'de.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Token SALT OKUNUR ve checkout'ta diske YAZILMIYOR (15 Ekim taraması).
# `permissions` yokken token depo varsayılanını alıyor ve checkout@v4
# varsayılanı onu `.git/config`e yazıyordu; hemen ardından `npm ci`
# yüzlerce bağımlılığın postinstall'ını o token erişilebilirken koşuyor —
# update.sh'ın VPS için belgeleyip kapattığı tedarik zinciri senaryosunun
# CI tarafı. Hiçbir adım token'la push yapmıyor (deploy SSH anahtarıyla).
permissions:
  contents: read

# SÜRÜMLER SABİT (15 Ekim): checkout/setup-node v5 Node 24 çalışma zamanında
# koşuyor (v4'ün Node 20'si kullanımdan kalktı, Actions uyarıyordu). Runner
# `ubuntu-24.04`e sabit: `ubuntu-latest` 19 Ekim'den itibaren Ubuntu 26'ya
# geçiyor ve deploy hattının sessizce değişmesi istenmiyor — yükseltme
# bilinçli bir commit olsun. Diğer iş akışları da aynı sürümlerde.

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Sıra bilinçli: typecheck `.next/types` altındaki üretilmiş tipleri
      # (PageProps, RouteContext) okuyor ve onlar yalnızca build sırasında
      # üretiliyor — CLAUDE.md'nin de belirttiği gibi build'den önce
      # typecheck çalıştırmak "Cannot find name 'PageProps'" verir.
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint

  deploy:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # Sunucunun SSH host anahtarı biliniyorsa SABİTLENİR. Runner her
      # koşumda boş known_hosts ile başladığı için `accept-new` fiilen "her
      # anahtarı kabul et" demek; VPS'e giden yolu kesen biri araya kendi
      # sunucusunu koyup stdin'den akan analiz anahtarını okuyabilirdi.
      # `VPS_HOST_KEY` repo değişkeni (bir kez `ssh-keyscan <host>` çıktısı)
      # tanımlıysa bağlantı yalnızca o anahtarı kabul eder; tanımlı değilse
      # eski davranış sürer ki deploy kilitlenmesin — değişkeni tanımlamak
      # bu uyarının kapanışı.
      - name: Host anahtarını sabitle
        env:
          VPS_HOST_KEY: ${{ vars.VPS_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          if [[ -n "$VPS_HOST_KEY" ]]; then
            printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
            echo "strict=yes" >> "$GITHUB_ENV"
          else
            echo "strict=accept-new" >> "$GITHUB_ENV"
          fi
      - name: Analiz anahtarını sunucuya aktar
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ vars.VPS_HOST }}
          CLAUDE_ANALYSIS_API_KEY: ${{ secrets.CLAUDE_ANALYSIS_API_KEY }}
        run: |
          if [[ -n "$CLAUDE_ANALYSIS_API_KEY" ]]; then
            bash deploy/sync-analysis-key.sh
          else
            echo "Analiz secret tanımlı değil; mevcut sunucu ortamı korunuyor."
          fi
      # E-posta ve Web Push anahtarları (15 Ekim): yalnız GitHub'da TANIMLI
      # olanlar sunucuya yazılır, tanımsız olan sunucudaki değerini korur.
      # Servis burada yeniden başlatılmıyor; hemen ardından update.sh başlatıyor.
      - name: Uygulama ortamını sunucuya aktar
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ vars.VPS_HOST }}
          RESTART: "0"
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          SITE_INDEXABLE: ${{ vars.SITE_INDEXABLE }}
        run: bash deploy/sync-app-env.sh
      - name: SSH ile sunucuda update.sh çalıştır
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ vars.VPS_HOST }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null /tmp/deploy_key
          printf '%s\n' "$SSH_KEY" > /tmp/deploy_key
          ssh -i /tmp/deploy_key -o "StrictHostKeyChecking=${strict:-accept-new}" -o ConnectTimeout=15 \
            "ubuntu@${HOST}" \
            'sudo -u acilis -H bash /srv/acilis-zili/current/deploy/update.sh'
