name: Links

# Kırık bağlantı taraması — canlı sitenin okuma sayfalarındaki bütün
# bağlantıları (iç ve dış) lychee ile haftada bir denetler.
#
# NEDEN CANLI SİTE: yazıların gövdesi veritabanında (Mercek, bülten) ve
# runner'da veritabanı yok; derlenmiş HTML'i ancak canlı site veriyor.
# Sayfa listesi site haritasından (`/sitemap.xml`) çıkıyor, yani yeni bir
# yazı ertesi taramada kendiliğinden kapsamda.
#
# KAPSAM: yalnız Türkçe okuma sayfaları — Mercek, rehber, sözlük, bülten,
# Yenilikler ve birkaç sabit sayfa. Hisse ve bilanço sayfaları (600+) aynı
# şablondan; bağlantıları kodda, duman testi zaten geziyor. EN karşılıkları
# aynı bağlantıları taşıyor.
#
# DAĞITIMI BEKLETMEZ: ayrı iş akışı, uyarı kanalı. Dış sitelerin bot
# engeli (403/429) kırık sayılmaz; finans sitelerinin çoğu başsız istemciyi
# geri çeviriyor ve bu bizim hatamız değil.

on:
  schedule:
    - cron: "0 5 * * 1" # pazartesi 08:00 TR
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write # kırık bağlantı raporu tek bir açık issue'da tutulur

concurrency:
  group: links
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: .github/scripts

      - name: Sayfa listesi (site haritası)
        id: pages
        run: |
          curl -fsSL https://aciliszili.com/sitemap.xml \
            | grep -o '<loc>[^<]*</loc>' | sed 's#<[^>]*>##g' \
            | grep -E '^https://aciliszili\.com/(mercek|rehber|sozluk|bulten|yenilikler|araci-kurumlar|vergi|hakkinda)(/|$)' \
            | sort -u > pages.txt
          echo "Taranacak sayfa: $(wc -l < pages.txt)" >> "$GITHUB_STEP_SUMMARY"
          echo "args=$(tr '\n' ' ' < pages.txt)" >> "$GITHUB_OUTPUT"

      - name: Bağlantıları denetle
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: false
          jobSummary: true
          args: >-
            --no-progress
            --max-concurrency 6
            --max-retries 2
            --timeout 30
            --accept 200..=299,401,402,403,429
            --user-agent "Mozilla/5.0 (compatible; AcilisZiliLinkCheck/1.0; +https://aciliszili.com/hakkinda)"
            --exclude "^https://(www\.)?(x|twitter|linkedin|facebook|instagram)\.com"
            --exclude "^https://aciliszili\.com/(api|_next)/"
            --exclude "^https://(www\.)?(npr\.org|usnews\.com|money\.usnews\.com)/"
            ${{ steps.pages.outputs.args }}

      # Lychee'nin hata saydığı adresler curl'le bir kez daha soruluyor: ilk
      # raporun 86 hatasının 77'si Yahoo'nun HTTP/2 hatasıydı, adresler
      # açılıyordu (gerekçe .github/scripts/links-recheck.py).
      - name: Hataları yeniden dene
        id: recheck
        run: |
          count=$(python3 .github/scripts/links-recheck.py lychee/out.md lychee/report.md)
          echo "broken=$count" >> "$GITHUB_OUTPUT"
          echo "Tekrar denemeden sonra kırık: $count" >> "$GITHUB_STEP_SUMMARY"

      # İŞ KIRMIZIYA DÖNMEZ (25 Ekim): ilk koşu 38 bin bağlantının 94'ünü
      # hata saydı; çoğu dış sitenin başsız istemciye kapısıydı (Yahoo'nun
      # HTTP/2 hatası, Reuters/WSJ ödeme duvarı). Her hafta düşen bir iş
      # bildirim gürültüsü olurdu. Rapor bunun yerine TEK bir açık issue'da
      # tutulur: kırık varsa güncellenir, yoksa kapanır.
      - name: Rapor issue'su
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BROKEN: ${{ steps.recheck.outputs.broken }}
        run: |
          title="Kırık Bağlantı Raporu"
          num=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ "${BROKEN:-0}" != "0" ]; then
            if [ -n "$num" ]; then gh issue edit "$num" --body-file lychee/report.md
            else gh issue create --title "$title" --body-file lychee/report.md; fi
          elif [ -n "$num" ]; then
            gh issue close "$num" --comment "Son taramada kırık bağlantı yok."
          fi
