name: Sync Claude Analysis Key

on:
  workflow_dispatch: {}

permissions:
  contents: read

# Env updates and releases must not restart the service concurrently.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update only the analysis secret and restart the service
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ vars.VPS_HOST }}
          CLAUDE_ANALYSIS_API_KEY: ${{ secrets.CLAUDE_ANALYSIS_API_KEY }}
        run: bash deploy/sync-analysis-key.sh
