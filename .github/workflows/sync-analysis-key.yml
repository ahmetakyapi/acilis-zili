name: Sync Claude Analysis Key

on:
  workflow_dispatch: {}

permissions:
  contents: read

# Env updates and releases must not restart the service concurrently.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Update only the analysis secret and restart the service
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ vars.VPS_HOST }}
          VPS_HOST_KEY: ${{ vars.VPS_HOST_KEY }}
          CLAUDE_ANALYSIS_API_KEY: ${{ secrets.CLAUDE_ANALYSIS_API_KEY }}
        run: |
          # Host anahtarı sabitlemesi — gerekçe deploy.yml (15 Ekim).
          if [[ -n "${VPS_HOST_KEY:-}" ]]; then
            mkdir -p ~/.ssh
            printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
            export strict=yes
          fi
          bash deploy/sync-analysis-key.sh
