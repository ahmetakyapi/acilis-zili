<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="32" height="32">
  <!--
    Sekme ikonu — `components/brand/BellMark` ile BİREBİR aynı çizim.
    Değişirse ikisi birlikte değişir; kaynak orası.

    GECE MAVİSİ: lacivert karo, beyaz zil, marka mavisi ağız çubuğu. Sekme
    temayı bilmediği için tek işaret; sitenin iki teması da aynı karoyu
    kullanıyor. Köşe yarıçapı BellMark kuralının aynısı: boyut / 3.

    TÖREN ZİLİ, bildirim zili değil: askı, omuzlu ve eteği açılan kubbe,
    ağız çubuğu ve ondan kopuk tokmak. Düz kenarlı eski kubbe 16 pikselde
    bir kutuya dönüşüyordu.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17345c"/>
      <stop offset="1" stop-color="#0a1a31"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="85.33" fill="url(#tile)"/>
  <!-- İç kenar: koyu sekme çubuğunda karoyu zeminden ayıran çizgi. -->
  <rect x="2" y="2" width="252" height="252" rx="83.33" fill="none" stroke="#9fd4ff" stroke-opacity="0.2" stroke-width="4"/>
  <!-- Görüş kutusu BELL_VIEWBOX: zil karoya %92 ölçekle, (128, 124) merkezli oturur. -->
  <svg width="256" height="256" viewBox="-11.13 -15.13 278.26 278.26" fill="#ffffff">
    <rect x="118" y="40" width="20" height="16" rx="8"/>
    <path d="M128 58c-27 0-44 20-46 47l-3 37c-1 11-7 18-18 22h134c-11-4-17-11-18-22l-3-37c-2-27-19-47-46-47z"/>
    <rect x="52" y="170" width="152" height="15" rx="7.5" fill="#35b8ff"/>
    <circle cx="128" cy="206" r="13"/>
  </svg>
</svg>
