<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="32" height="32">
  <!--
    Sekme ikonu — `components/brand/BellMark` ile BİREBİR aynı geometri.
    Değişirse ikisi birlikte değişir; kaynak orası.

    TÖREN ZİLİ, bildirim zili değil: ayrık topuz, dar ve uzun kubbe, keskin
    ağız çubuğu (sitenin gün şeridinin yankısı) ve ondan kopuk tokmak.
    Önceki çizim her uygulamanın notification ikonuydu ve 16px'te tokmak
    gövdeye karışıp tek lekeye dönüşüyordu.

    Zil BEYAZ — sitenin kendi logosuyla aynı. Bir ara koyu mürekkepti ve
    sekmedeki işaret, sayfanın sol üstündeki işaretle aynı marka değilmiş
    gibi duruyordu. Köşe yarıçapı BellMark kuralının aynısı: boyut / 3.
  -->
  <defs>
    <linearGradient id="tile" x1="12%" y1="0%" x2="88%" y2="100%">
      <stop offset="0" stop-color="#6fd0ff"/>
      <stop offset="0.46" stop-color="#2f95e8"/>
      <stop offset="1" stop-color="#124f9e"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="85" fill="url(#tile)"/>
  <!-- İç kenar ışığı: karoyu düz kare değil basılmış bir rozet gibi gösterir. -->
  <rect x="2" y="2" width="252" height="252" rx="83" fill="none" stroke="#ffffff" stroke-opacity="0.20" stroke-width="4"/>
  <!--
    Zil, DAR görüş kutusuyla büyütülür. Geometri `0 0 256 256` içinde
    çizildi ama zil o alanın yalnızca %66'sını (dikey) kaplıyor; doğrudan
    basılınca karoda küçük duruyordu. İç svg zilin sınırlarına çekilmiş bir
    kutuyla (BELL_VIEWBOX) yeniden ölçekleniyor — koordinatlar değişmedi,
    yalnızca çerçeve daraldı. Kaynak: components/brand/BellMark.tsx
  -->
  <svg x="46" y="46" width="164" height="164" viewBox="35 31 186 186" fill="#ffffff">
    <circle cx="128" cy="50" r="11"/>
    <path d="M128 68c-30 0-53 24-53 54v33h106v-33c0-30-23-54-53-54z"/>
    <rect x="56" y="159" width="144" height="16" rx="8"/>
    <circle cx="128" cy="196" r="12"/>
  </svg>
</svg>
